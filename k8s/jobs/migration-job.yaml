apiVersion: batch/v1
kind: Job
metadata:
  name: perionyx-migration
  namespace: perionyx
  labels:
    app: perionyx
    component: migration
  annotations:
    "helm.sh/hook": pre-upgrade,pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: perionyx
        component: migration
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: perionyx/app:latest
          command:
            - sh
            - -c
            - |
              npx prisma migrate deploy && npx prisma generate
          envFrom:
            - configMapRef:
                name: perionyx-config
            - secretRef:
                name: perionyx-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$DB_HOST" -p 5432 -U "$DB_USER" -d "$DB_NAME" 2>/dev/null; do
                echo "Waiting for database..."
                sleep 2
              done
              echo "Database is ready."
          envFrom:
            - secretRef:
                name: perionyx-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
